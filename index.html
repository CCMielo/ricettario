    // RICALCOLO DOSI
    // Nei testi delle ricette: [[400]] = quantità che si ricalcola, [[#14]] = numero di pezzi,
    // [[@83]] = grammi di ogni pezzo (impasto crudo, somma degli ingredienti diviso il numero di pezzi).
    // Le ricette senza "scaling" non hanno marcatori.
    const QTY_MARKER = /\[\[([#@]?)(\d+(?:[.,]\d+)?)\]\]/g;

    function stripQtyMarkers(text) {
      return text.replace(QTY_MARKER, '$2');
    }

    function formatQty(value) {
      const rounded = value >= 10 ? Math.round(value) : Math.round(value * 10) / 10;
      return String(rounded).replace('.', ',');
    }

    // Trasforma i marcatori in elementi aggiornabili. Negli ingredienti la prima quantità di ogni riga è un campo modificabile.
    function qtyMarkup(text, editableFirst = false) {
      let first = editableFirst;
      return text.replace(QTY_MARKER, (match, kind, num) => {
        const base = parseFloat(num.replace(',', '.'));
        if (kind === '#') return `<span class="qty-pieces font-semibold">${formatQty(base)}</span>`;
        if (kind === '@') return `<span class="qty-weight font-semibold">${formatQty(base)}</span>`;
        if (first) {
          first = false;
          return `<input type="number" inputmode="decimal" min="0" step="any" value="${formatQty(base).replace(',', '.')}" data-base="${base}" aria-label="Quantità" class="qty-input w-16 px-1.5 py-0.5 mx-0.5 bg-white dark:bg-stone-800 border border-amber-300 dark:border-amber-700 rounded-md text-center font-semibold text-amber-800 dark:text-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-500">`;
        }
        return `<span class="qty font-semibold" data-base="${base}">${formatQty(base)}</span>`;
      });
    }

    function scalingPanelHtml(scaling) {
      return `
        <div class="mb-6 bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/80 dark:border-amber-800/50 rounded-xl p-4">
          <div class="flex flex-wrap items-end gap-4">
            <label class="flex flex-col text-xs font-semibold text-stone-600 dark:text-stone-400 uppercase tracking-wider">
              Quanti ${scaling.label}
              <input type="number" id="scalePieces" inputmode="numeric" min="1" step="1" value="${scaling.pieces}" class="mt-1 w-24 px-3 py-2 bg-white dark:bg-stone-900 border border-amber-300 dark:border-amber-700 rounded-xl font-bold text-amber-700 dark:text-amber-400 text-center text-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </label>
            <label class="flex flex-col text-xs font-semibold text-stone-600 dark:text-stone-400 uppercase tracking-wider">
              Grammi ${scaling.weightNote || 'ciascuno (crudo)'}
              <input type="number" id="scaleWeight" inputmode="decimal" min="1" step="any" value="${scaling.pieceWeight}" class="mt-1 w-24 px-3 py-2 bg-white dark:bg-stone-900 border border-amber-300 dark:border-amber-700 rounded-xl font-bold text-amber-700 dark:text-amber-400 text-center text-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </label>
            <button type="button" id="scaleReset" class="px-3 py-2 bg-white dark:bg-stone-900 hover:bg-amber-600 hover:text-white border border-stone-200 dark:border-stone-800 rounded-xl text-xs font-semibold transition-all">
              <i class="fa-solid fa-rotate-left mr-1"></i> Dosi originali
            </button>
          </div>
          <p class="text-xs text-stone-500 dark:text-stone-400 mt-3">Puoi anche cambiare un singolo ingrediente: tutti gli altri, e le dosi nei passaggi, si ricalcolano in proporzione. Tempi e temperature restano quelli della ricetta.</p>
        </div>
      `;
    }

    function initScaling(scaling) {
      const baseTotal = scaling.pieces * scaling.pieceWeight;
      const piecesInput = document.getElementById('scalePieces');
      const weightInput = document.getElementById('scaleWeight');
      let pieces = scaling.pieces;
      let factor = 1;

      function apply(skip) {
        const weight = baseTotal * factor / pieces;
        document.querySelectorAll('#recipeContainer .qty').forEach(el => {
          el.textContent = formatQty(parseFloat(el.dataset.base) * factor);
        });
        document.querySelectorAll('#recipeContainer .qty-input').forEach(el => {
          if (el !== skip) el.value = formatQty(parseFloat(el.dataset.base) * factor).replace(',', '.');
        });
        document.querySelectorAll('#recipeContainer .qty-pieces').forEach(el => { el.textContent = formatQty(pieces); });
        document.querySelectorAll('#recipeContainer .qty-weight').forEach(el => { el.textContent = formatQty(weight); });
        if (skip !== piecesInput) piecesInput.value = pieces;
        if (skip !== weightInput) weightInput.value = formatQty(weight).replace(',', '.');
      }

      function readPositive(input) {
        const v = parseFloat(String(input.value).replace(',', '.'));
        return v > 0 ? v : null;
      }

      piecesInput.addEventListener('input', () => {
        const p = readPositive(piecesInput);
        const w = readPositive(weightInput);
        if (!p || !w) return;
        pieces = p;
        factor = (p * w) / baseTotal;
        apply(piecesInput);
      });

      weightInput.addEventListener('input', () => {
        const w = readPositive(weightInput);
        if (!w) return;
        factor = (pieces * w) / baseTotal;
        apply(weightInput);
      });

      document.querySelectorAll('#recipeContainer .qty-input').forEach(input => {
        input.addEventListener('input', () => {
          const v = readPositive(input);
          if (!v) return;
          factor = v / parseFloat(input.dataset.base);
          apply(input);
        });
      });

      document.getElementById('scaleReset').addEventListener('click', () => {
        pieces = scaling.pieces;
        factor = 1;
        apply(null);
      });
    }

    // FUNZIONE RENDER PRINCIPALE RICETTA
    function renderRecipe(recipe) {
      const container = document.getElementById('recipeContainer');
      
      // Update breadcrumb
      document.getElementById('breadcrumbCategory').textContent = recipe.category;
      document.getElementById('breadcrumbTitle').textContent = recipe.title;

            <span>Prot: 2,8 g</span>
            <span>Carb: 9,5 g (Zuccheri 9,2 g)</span>
            <span>Grassi: 41,1 g (Sat: 26,1 g)</span>
          </div>
        </div>
      `;
    }

    // STATO DELL'APPLICAZIONE E INIZIALIZZAZIONE
    let activeRecipeId = recipes[0].id;
    let selectedCategoryFilter = "all";
    let searchFilterQuery = "";
    let fontSizeLevel = 100;

    // RENDERING SIDEBAR E CATEGORIE
    function renderSidebar() {
      const nav = document.getElementById('recipeList');
      if (!nav) return;

      // Filtra le ricette in base a categoria e ricerca
      // Le versioni alternative (V2...) non hanno una voce propria: si aprono dalla ricetta principale
      const filteredRecipes = recipes.filter(r => !r.versionOf).filter(r => {
        const matchesCategory = selectedCategoryFilter === "all" || r.category === selectedCategoryFilter;
        const matchesQuery = searchFilterQuery === "" || 
          r.title.toLowerCase().includes(searchFilterQuery.toLowerCase()) || 
          r.subtitle.toLowerCase().includes(searchFilterQuery.toLowerCase()) ||
          (r.ingredients && r.ingredients.some(ig => ig.items.some(it => stripQtyMarkers(it).toLowerCase().includes(searchFilterQuery.toLowerCase()))));
        return matchesCategory && matchesQuery;
      });

      // Aggiorna contatore ricette
      const countEl = document.getElementById('recipeCount');
      if (countEl) countEl.textContent = `${filteredRecipes.length} Ricett${filteredRecipes.length === 1 ? 'a' : 'e'}`;

      if (filteredRecipes.length === 0) {
        nav.innerHTML = `
          <div class="text-center py-8 text-stone-400 dark:text-stone-500 text-sm">
            <i class="fa-solid fa-cookie-bite text-3xl mb-2 block opacity-50"></i>
            Nessuna ricetta trovata
          </div>
        `;
        return;
      }

      // Raggruppa le ricette filtrate per Categoria
      const categoriesOrder = ["Lievitati Salati", "Panificazione", "Lievitati Dolci", "Dolci & Biscotti", "Fitness & Wellness"];
      const grouped = {};

      filteredRecipes.forEach(recipe => {
        if (!grouped[recipe.category]) {
          grouped[recipe.category] = [];
        }
        grouped[recipe.category].push(recipe);
      });

      let navHtml = "";

      // Se è aperta una versione alternativa (V2...), nel menu resta evidenziata la ricetta principale
      const activeBaseId = recipes.find(r => r.id === activeRecipeId)?.versionOf || activeRecipeId;

      // Categorie non previste (es. nome scritto diverso) vanno in fondo invece di sparire dal menu
      const allCategories = categoriesOrder.concat(Object.keys(grouped).filter(cat => !categoriesOrder.includes(cat)));

      allCategories.forEach(catName => {
        if (grouped[catName] && grouped[catName].length > 0) {
          navHtml += `
            <div class="mb-4">
              <div class="flex items-center justify-between px-2 py-1 mb-1 text-[11px] font-bold text-stone-400 uppercase tracking-wider">
                <span>${catName}</span>
                <span class="bg-stone-200 dark:bg-stone-800 text-stone-600 dark:text-stone-300 px-1.5 py-0.5 rounded-full text-[10px] font-sans">${grouped[catName].length}</span>
              </div>
              <div class="space-y-1">
                ${grouped[catName].map(recipe => {
                  const isActive = recipe.id === activeBaseId;
                  return `
                    <button onclick="selectRecipe('${recipe.id}')" class="w-full text-left px-3 py-2.5 rounded-xl transition-all flex items-center space-x-3 ${isActive ? 'bg-amber-600 text-white shadow-md shadow-amber-600/20 font-medium' : 'text-stone-700 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-900'}">
                      <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ${isActive ? 'bg-amber-700 text-white' : 'bg-stone-100 dark:bg-stone-800 text-amber-600 dark:text-amber-400'}">
                        <i class="fa-solid ${recipe.icon} text-xs"></i>
                      </div>
                      <div class="truncate flex-1">
                        <div class="text-xs font-semibold leading-tight truncate">${recipe.title}</div>
                        <div class="text-[10px] ${isActive ? 'text-amber-100' : 'text-stone-400'} truncate">${recipe.subtitle}</div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      });

      nav.innerHTML = navHtml;
    }

    // SELEZIONE RICETTA
    function selectRecipe(recipeId) {
      activeRecipeId = recipeId;
      const recipe = recipes.find(r => r.id === recipeId);
      if (recipe) {
        renderRecipe(recipe);
        // La ricetta nuova si apre dall'inizio, non alla posizione di scorrimento della precedente
        const main = document.querySelector('main');
        if (main) main.scrollTop = 0;
        renderSidebar();
        closeMobileSidebar();
      }
    }

    // GESTIONE SIDEBAR MOBILE
    function openMobileSidebar() {
      document.getElementById('sidebar')?.classList.remove('-translate-x-full');
      document.getElementById('mobileOverlay')?.classList.remove('hidden');
    }

    function closeMobileSidebar() {
      document.getElementById('sidebar')?.classList.add('-translate-x-full');
      document.getElementById('mobileOverlay')?.classList.add('hidden');
    }

    // EVENT LISTENERS AL CARICAMENTO
    window.addEventListener('DOMContentLoaded', () => {
      // Inizializza prima ricetta
      const initialRecipe = recipes.find(r => r.id === activeRecipeId) || recipes[0];
      renderRecipe(initialRecipe);
      renderSidebar();

      // Mobile Menu
      document.getElementById('mobileMenuBtn')?.addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn')?.addEventListener('click', closeMobileSidebar);
      document.getElementById('mobileOverlay')?.addEventListener('click', closeMobileSidebar);

      // Dark Mode Toggle
      document.getElementById('darkModeToggle')?.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        try {
          localStorage.setItem('ricettario-tema', isDark ? 'scuro' : 'chiaro');
        } catch (e) {}
      });

      // Ricerca
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearch');

      searchInput?.addEventListener('input', (e) => {
        searchFilterQuery = e.target.value.trim();
        if (searchFilterQuery.length > 0) {
          clearSearchBtn?.classList.remove('hidden');
        } else {
          clearSearchBtn?.classList.add('hidden');
        }
        renderSidebar();
      });

      clearSearchBtn?.addEventListener('click', () => {
        if (searchInput) searchInput.value = "";
        searchFilterQuery = "";
        clearSearchBtn.classList.add('hidden');
        renderSidebar();
      });

      // Filtri Categoria Veloci
      document.querySelectorAll('.cat-filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.cat-filter-btn').forEach(b => {
            b.classList.remove('bg-amber-600', 'text-white');
            b.classList.add('bg-stone-100', 'dark:bg-stone-800', 'text-stone-600', 'dark:text-stone-300');
          });
          const target = e.currentTarget;
          target.classList.remove('bg-stone-100', 'dark:bg-stone-800', 'text-stone-600', 'dark:text-stone-300');
          target.classList.add('bg-amber-600', 'text-white');

          selectedCategoryFilter = target.getAttribute('data-cat') || 'all';
          renderSidebar();
        });
      });

      // Controlli Font Size
      // Le dimensioni del testo di Tailwind sono fisse (rem), quindi cambiare font-size non le toccava:
      // "zoom" ingrandisce tutta la ricetta in proporzione (testo, spazi e icone).
      const recipeContainer = document.getElementById('recipeContainer');
      function setFontSizeLevel(level) {
        fontSizeLevel = level;
        if (recipeContainer) recipeContainer.style.zoom = fontSizeLevel / 100;
        const fontResetBtn = document.getElementById('resetFont');
        if (fontResetBtn) fontResetBtn.textContent = `${fontSizeLevel}%`;
      }

      document.getElementById('increaseFont')?.addEventListener('click', () => {
        if (fontSizeLevel < 140) setFontSizeLevel(fontSizeLevel + 10);
      });

      document.getElementById('decreaseFont')?.addEventListener('click', () => {
        if (fontSizeLevel > 80) setFontSizeLevel(fontSizeLevel - 10);
      });

      document.getElementById('resetFont')?.addEventListener('click', () => setFontSizeLevel(100));

      // Stampa
      document.getElementById('printBtn')?.addEventListener('click', () => {
        window.print();
      });
    });
  </script>
  <script>
    // App installabile: registra il service worker (offline + aggiornamento automatico)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    // Data di aggiornamento automatica: è la data di pubblicazione della pagina su GitHub Pages
    const lastUpdated = new Date(document.lastModified);
    if (!isNaN(lastUpdated)) {
      document.getElementById('lastUpdated').textContent = 'Aggiornato il ' + lastUpdated.toLocaleDateString('it-IT');
    }
  </script>
</body>
</html>
