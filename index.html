  <style>

            <span>Carb: 9.5g (Zuccheri 9.2g)</span>
            <span>Grassi: 41.1g (Sat: 26.1g)</span>
          </div>
        </div>
      `;
    }

    // STATO DELL'APPLICAZIONE E INIZIALIZZAZIONE
    let activeRecipeId = recipes[0].id;
    let selectedCategoryFilter = "all";
    let searchFilterQuery = "";
    let fontSizeLevel = 100;

    // RENDERING SIDEBAR E CATEGORIE
    function renderSidebar() {
      const nav = document.getElementById('recipeList');
      if (!nav) return;

      // Filtra le ricette in base a categoria e ricerca
      const filteredRecipes = recipes.filter(r => {
        const matchesCategory = selectedCategoryFilter === "all" || r.category === selectedCategoryFilter;
        const matchesQuery = searchFilterQuery === "" || 
          r.title.toLowerCase().includes(searchFilterQuery.toLowerCase()) || 
          r.subtitle.toLowerCase().includes(searchFilterQuery.toLowerCase()) ||
          (r.ingredients && r.ingredients.some(ig => ig.items.some(it => it.toLowerCase().includes(searchFilterQuery.toLowerCase()))));
        return matchesCategory && matchesQuery;
      });

      // Aggiorna contatore ricette
      const countEl = document.getElementById('recipeCount');
      if (countEl) countEl.textContent = `${filteredRecipes.length} Ricett${filteredRecipes.length === 1 ? 'a' : 'e'}`;

      if (filteredRecipes.length === 0) {
        nav.innerHTML = `
          <div class="text-center py-8 text-stone-400 dark:text-stone-500 text-sm">
            <i class="fa-solid fa-cookie-bite text-3xl mb-2 block opacity-50"></i>
            Nessuna ricetta trovata
          </div>
        `;
        return;
      }

      // Raggruppa le ricette filtrate per Categoria
      const categoriesOrder = ["Lievitati Salati", "Panificazione", "Lievitati Dolci", "Dolci & Biscotti", "Fitness & Wellness"];
      const grouped = {};

      filteredRecipes.forEach(recipe => {
        if (!grouped[recipe.category]) {
          grouped[recipe.category] = [];
        }
        grouped[recipe.category].push(recipe);
      });

      let navHtml = "";

      categoriesOrder.forEach(catName => {
        if (grouped[catName] && grouped[catName].length > 0) {
          navHtml += `
            <div class="mb-4">
              <div class="flex items-center justify-between px-2 py-1 mb-1 text-[11px] font-bold text-stone-400 uppercase tracking-wider">
                <span>${catName}</span>
                <span class="bg-stone-200 dark:bg-stone-800 text-stone-600 dark:text-stone-300 px-1.5 py-0.2 rounded-full text-[10px] font-sans">${grouped[catName].length}</span>
              </div>
              <div class="space-y-1">
                ${grouped[catName].map(recipe => {
                  const isActive = recipe.id === activeRecipeId;
                  return `
                    <button onclick="selectRecipe('${recipe.id}')" class="w-full text-left px-3 py-2.5 rounded-xl transition-all flex items-center space-x-3 ${isActive ? 'bg-amber-600 text-white shadow-md shadow-amber-600/20 font-medium' : 'text-stone-700 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-900'}">
                      <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ${isActive ? 'bg-amber-700 text-white' : 'bg-stone-100 dark:bg-stone-800 text-amber-600 dark:text-amber-400'}">
                        <i class="fa-solid ${recipe.icon} text-xs"></i>
                      </div>
                      <div class="truncate flex-1">
                        <div class="text-xs font-semibold leading-tight truncate">${recipe.title}</div>
                        <div class="text-[10px] ${isActive ? 'text-amber-100' : 'text-stone-400'} truncate">${recipe.subtitle}</div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      });

      nav.innerHTML = navHtml;
    }

    // SELEZIONE RICETTA
    function selectRecipe(recipeId) {
      activeRecipeId = recipeId;
      const recipe = recipes.find(r => r.id === recipeId);
      if (recipe) {
        renderRecipe(recipe);
        renderSidebar();
        closeMobileSidebar();
      }
    }

    // GESTIONE SIDEBAR MOBILE
    function openMobileSidebar() {
      document.getElementById('sidebar')?.classList.remove('-translate-x-full');
      document.getElementById('mobileOverlay')?.classList.remove('hidden');
    }

    function closeMobileSidebar() {
      document.getElementById('sidebar')?.classList.add('-translate-x-full');
      document.getElementById('mobileOverlay')?.classList.add('hidden');
    }

    // EVENT LISTENERS AL CARICAMENTO
    window.addEventListener('DOMContentLoaded', () => {
      // Inizializza prima ricetta
      const initialRecipe = recipes.find(r => r.id === activeRecipeId) || recipes[0];
      renderRecipe(initialRecipe);
      renderSidebar();

      // Mobile Menu
      document.getElementById('mobileMenuBtn')?.addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn')?.addEventListener('click', closeMobileSidebar);
      document.getElementById('mobileOverlay')?.addEventListener('click', closeMobileSidebar);

      // Dark Mode Toggle
      document.getElementById('darkModeToggle')?.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });

      // Ricerca
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearch');

      searchInput?.addEventListener('input', (e) => {
        searchFilterQuery = e.target.value.trim();
        if (searchFilterQuery.length > 0) {
          clearSearchBtn?.classList.remove('hidden');
        } else {
          clearSearchBtn?.classList.add('hidden');
        }
        renderSidebar();
      });

      clearSearchBtn?.addEventListener('click', () => {
        if (searchInput) searchInput.value = "";
        searchFilterQuery = "";
        clearSearchBtn.classList.add('hidden');
        renderSidebar();
      });

      // Filtri Categoria Veloci
      document.querySelectorAll('.cat-filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.cat-filter-btn').forEach(b => {
            b.classList.remove('bg-amber-600', 'text-white');
            b.classList.add('bg-stone-100', 'dark:bg-stone-800', 'text-stone-600', 'dark:text-stone-300');
          });
          const target = e.currentTarget;
          target.classList.remove('bg-stone-100', 'dark:bg-stone-800', 'text-stone-600', 'dark:text-stone-300');
          target.classList.add('bg-amber-600', 'text-white');

          selectedCategoryFilter = target.getAttribute('data-cat') || 'all';
          renderSidebar();
        });
      });

      // Controlli Font Size
      const recipeContainer = document.getElementById('recipeContainer');
      document.getElementById('increaseFont')?.addEventListener('click', () => {
        if (fontSizeLevel < 140) {
          fontSizeLevel += 10;
          if (recipeContainer) recipeContainer.style.fontSize = `${fontSizeLevel}%`;
          const fontResetBtn = document.getElementById('resetFont');
          if (fontResetBtn) fontResetBtn.textContent = `${fontSizeLevel}%`;
        }
      });

      document.getElementById('decreaseFont')?.addEventListener('click', () => {
        if (fontSizeLevel > 80) {
          fontSizeLevel -= 10;
          if (recipeContainer) recipeContainer.style.fontSize = `${fontSizeLevel}%`;
          const fontResetBtn = document.getElementById('resetFont');
          if (fontResetBtn) fontResetBtn.textContent = `${fontSizeLevel}%`;
        }
      });

      document.getElementById('resetFont')?.addEventListener('click', () => {
        fontSizeLevel = 100;
        if (recipeContainer) recipeContainer.style.fontSize = `100%`;
        const fontResetBtn = document.getElementById('resetFont');
        if (fontResetBtn) fontResetBtn.textContent = `100%`;
      });

      // Stampa
      document.getElementById('printBtn')?.addEventListener('click', () => {
        window.print();
      });
    });
  </script>
  <script>
    // App installabile: registra il service worker (offline + aggiornamento automatico)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    // Data di aggiornamento automatica: è la data di pubblicazione della pagina su GitHub Pages
    const lastUpdated = new Date(document.lastModified);
    if (!isNaN(lastUpdated)) {
      document.getElementById('lastUpdated').textContent = 'Aggiornato il ' + lastUpdated.toLocaleDateString('it-IT');
    }
  </script>
</body>
</html>
